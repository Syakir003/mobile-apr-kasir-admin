name: epos_ac
description: APR-POS - aplikasi kasir, admin, dan teknisi AC.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.9.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.3.0
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  # Membuka WhatsApp dari layar Pengingat lewat tautan wa.me — "adapter manual"
  # pengiriman pesan servis selama Cloud API Meta belum disetujui.
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Hanya untuk membangkitkan mipmap launcher dari assets/brand/favicon-512.png
  # (`dart run flutter_launcher_icons`). Tidak ikut ke dalam APK.
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/favicon-512.png
  # Android 8+ memangkas ikon adaptif ke ~66% bidang; tanpa inset huruf A
  # ikut terpotong di launcher yang memakai mask bulat.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/favicon-512.png
  adaptive_icon_foreground_inset: 18

flutter:
  uses-material-design: true

  assets:
    # Font untuk dokumen PDF (struk & label unit). Helvetica bawaan `pdf`
    # tidak punya dukungan Unicode, sehingga karakter seperti • — × dan huruf
    # beraksen pada nama pelanggan hilang dari cetakan. Roboto disalin dari
    # SDK Flutter (Apache-2.0, lisensi ikut disertakan).
    - assets/fonts/
    # Logo perusahaan: `logo-apr-trim` (lanskap) untuk kop login & dokumen
    # cetak, `favicon-512` (bujur sangkar) untuk avatar nav & ikon launcher.
    - assets/brand/

  # Tipografi style guide "Corporate Modernism" (Figma: Style Guide DealDeck
  # E-POS AC). Semua font di-bundle, bukan diunduh saat runtime, supaya
  # tampilan tetap benar saat perangkat kasir/teknisi offline.
  # Lisensi SIL OFL 1.1 ikut disertakan di assets/fonts/.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
