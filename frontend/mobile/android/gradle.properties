# ponytail: laptop punya 15GB RAM total, biasanya cuma 2-4GB nganggur (Docker/WSL
# + IDE + browser). -Xmx8G+4G metaspace lama minta lebih dari yang tersedia ->
# native mmap gagal, Gradle daemon crash. Naikkan lagi kalau laptop di-upgrade RAM.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# ponytail: project on D:\ but Android SDK/caches on C:\ -> Kotlin IC crashes with
# "different roots". Full recompile every build (~1min slower). Re-enable if the
# project and the Android SDK ever live on the same drive.
kotlin.incremental=false
